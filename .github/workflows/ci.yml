name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへ続けて push したら古い実行は畳む
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows も回す: ロックのキーは \ を / へ正規化しているし、Studio の
        # Plugins フォルダ解決と fetch の出力先判定は path.sep を見ている。
        # windows-2022 に固定している: windows-latest の Visual Studio 18 を
        # npm 同梱の node-gyp 10 が認識できず、lz4 のビルドが落ちるため。
        os: [ubuntu-latest, windows-2022]
        # 18 は package.json の engines の下限、22 は現行 LTS。
        node: [18, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # install スクリプトは飛ばせない。rbxm-parser が読む lz4 は tarball に
      # ビルド済みの xxhash.node を同梱しているが、それはどの runner でも
      # 読めない (Linux では invalid ELF header、Windows では not a valid Win32
      # application)。node-gyp rebuild を走らせて自前でビルドする必要がある。
      #
      # npm 12 は依存の install スクリプトを既定でブロックするので、package.json
      # の allowScripts に lz4 を入れてある。外すと runner の npm が 12 に上がった
      # 瞬間にここが黙って素通りし、npm test が ERR_DLOPEN_FAILED で落ちる。
      - run: npm ci

      - run: npm test
